    <circle cx="176" cy="136" r="44" fill="#e8b27c"/>
    <circle cx="176" cy="136" r="33" fill="#f6c344" stroke-width="2.5"/>
    <circle cx="176" cy="136" r="21" fill="#e8b27c" stroke-width="2.5"/>
    <circle cx="176" cy="136" r="8" fill="#8a5a3b"/>
