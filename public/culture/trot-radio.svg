    <rect x="132" y="204" width="22" height="8" rx="3" fill="#4a3b32"/>
    <rect x="270" y="204" width="22" height="8" rx="3" fill="#4a3b32"/>
    <!-- notes -->
    <line x1="66" y1="64" x2="66" y2="40" stroke-width="5"/>
    <path d="M67 38 C73 48 83 50 79 64 C77 56 73 54 67 54 Z" fill="#d9412b"/>
    <ellipse cx="57" cy="67" rx="11" ry="8" transform="rotate(-20 57 67)" fill="#d9412b"/>
