    <path d="M123 10 C128 18 136 20 133 32 C131 25 128 24 123 24 Z" fill="#9b7bd4"/>
    <ellipse cx="114" cy="37" rx="10" ry="7" transform="rotate(-20 114 37)" fill="#9b7bd4"/>
