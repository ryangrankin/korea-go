    <circle cx="280" cy="148" r="13" fill="#5aa469"/>
    <path d="M246 148 L246 138 M280 148 L288 141" stroke-width="3"/>
    <rect x="236" y="172" width="54" height="12" rx="6" fill="#8a5a3b"/>
